# Side-by-side environment for the Nuxt rewrite:
#   web -> new Nuxt app                         http://<host>:8402
#   ci3 -> legacy PHP app (regression baseline)  http://<host>:8401  (profile "legacy", tests only)
# Each app gets its own database in the shared MariaDB instance.
name: sharif-judge

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-shj_root}
      MARIADB_USER: shj
      MARIADB_PASSWORD: ${DB_PASSWORD:-shj_pass}
    volumes:
      - db:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  web:
    image: ${IMAGE:-sharif-judge-web:latest}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # 1 adds the Swift compiler (about 1.2 GB more image); see docs/guide/installation.md.
        WITH_SWIFT: ${WITH_SWIFT:-0}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NUXT_DB_HOST: db
      NUXT_DB_USER: shj
      NUXT_DB_PASSWORD: ${DB_PASSWORD:-shj_pass}
      NUXT_DB_DATABASE: ${WEB_DB:-shj_web}
      NUXT_SESSION_PASSWORD: ${SESSION_PASSWORD:?set SESSION_PASSWORD (32+ characters) in docker/.env}
      NUXT_JUDGE_MODE: remote
      NUXT_BACKUP_DIR: /backups
      # Optional, from docker/.env (see docs/guide/installation.md):
      NUXT_APP_BASE_URL: ${BASE_URL:-/}                             # e.g. /judge/ to serve under a sub-path
      NUXT_SESSION_COOKIE_PATH: ${BASE_URL:-/}                      # the cookie stays under that path
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-false}                       # true behind a reverse proxy
      NUXT_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}  # true when served over HTTPS
    # WEB_PORT can include an address, e.g. 127.0.0.1:8410 to reach the app only through a proxy.
    ports: ["${WEB_PORT:-8402}:3000"]
    volumes:
      - web-data:/data
      # Shield files edited in Settings > Shields; shared with the judge.
      - shields:/app/tester/shield
      - ${BACKUP_DIR:-./backups}:/backups:ro
      # The only backup folder the web app can write: schedule and "back up now" requests.
      - ${BACKUP_DIR:-./backups}/control:/backups/control

  # Runs submitted code. No network, no secrets, and the code itself runs as an
  # unprivileged user that can only touch its own jail directory.
  judge:
    image: ${IMAGE:-sharif-judge-web:latest}  # the same image as web
    pull_policy: never
    depends_on: [web]
    restart: unless-stopped
    user: root
    command: ["node", "/app/judge/worker.mjs"]
    network_mode: none
    volumes:
      - web-data:/data
      - shields:/app/tester/shield:ro
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]

  # Daily database dump + assignment files into ./backups (see docker/README.md).
  backup:
    image: mariadb:10.11
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-shj_root}
      BACKUP_DB: ${WEB_DB:-shj_web}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - web-data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups

  # Legacy PHP app, only for tests/regression (code from tag archive/php-final).
  ci3:
    build:
      context: ../tests/regression/legacy
    profiles: ["legacy"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["8401:80"]
    volumes:
      - ${CI3_SRC:-../ci3}:/var/www/html

volumes:
  db:
  web-data:
  # Filled from the image on first start; afterwards it keeps the admin's edits.
  shields:
